# CI do Command Center (issue #16). Todo PR e todo push no branch do VPS passam por aqui:
# lint, testes unitários e de integração, build do frontend e end-to-end no navegador.
name: CI

on:
  pull_request:
  push:
    branches: [claude/commandcenter-vps, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #387 (dono, 22/10: *"encurte isso de agora p frente esta demorando demais"*): o CI do PR já testa o código unido
  # à base. Verde, ele grava `ci-arvore/<árvore>`. No push ao branch da VPS, se a árvore do commit do merge é a
  # mesma (a base não andou entre o CI e o merge), os testes não rodam de novo e a tag ci-verde sai na hora.
  # Árvore diferente (outro merge no meio): roda tudo, como antes.
  arvore:
    name: Já testado? (mesma árvore de um PR verde)
    runs-on: ubuntu-latest
    outputs:
      testada: ${{ steps.v.outputs.testada }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          testada=false
          if [ "${{ github.event_name }}" = push ]; then
            arvore=$(gh api "repos/${{ github.repository }}/git/commits/${{ github.sha }}" --jq .tree.sha)
            if gh api "repos/${{ github.repository }}/git/ref/tags/ci-arvore/$arvore" > /dev/null 2>&1; then
              testada=true
              echo "árvore $arvore já passou no CI do PR: não repete a bateria"
            fi
          fi
          echo "testada=$testada" >> "$GITHUB_OUTPUT"

  # #344 (dono, 19/10): a rodada levava ~20 min. O pytest do backend e o end-to-end rodam em 3 máquinas cada,
  # ao mesmo tempo, sem tirar nenhum teste: o conftest.py da raiz (`--parte K/N`) reparte por arquivo (o
  # arquivo inteiro numa parte, na ordem; o grande do e2e em blocos seguidos), cada teste numa parte só. Cada parte imprime "parte K/N: X de T".
  # N vem de strategy.job-total: aumentar a matriz já redivide, sem mexer no comando.
  python:
    name: Python — ruff + pytest (${{ matrix.parte }}/${{ strategy.job-total }})
    needs: arvore
    if: needs.arvore.outputs.testada != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # uma parte vermelha não cancela as outras: aparece tudo que quebrou
      matrix:
        parte: [1, 2, 3, 4, 5, 6]   # #387: 6 máquinas (eram 3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: command_center/requirements.txt
      - run: pip install -r command_center/requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: python -m pytest -q --parte ${{ matrix.parte }}/${{ strategy.job-total }}

  web:
    name: Frontend — tsc + oxlint + build
    needs: arvore
    if: needs.arvore.outputs.testada != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command_center/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: command_center/web/package-lock.json
      - run: npm ci
      - run: npx oxlint src          # erro quebra; os avisos antigos ficam para limpeza gradual
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: command_center/web/dist
          retention-days: 3

  # o build do frontend sai uma vez no job web e cada parte do e2e baixa o mesmo `dist`
  e2e:
    name: End-to-end — Playwright no Chromium (${{ matrix.parte }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [arvore, web]
    if: needs.arvore.outputs.testada != 'true'
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4, 5, 6]   # #387: 6 máquinas (eram 3)
    env:
      # o conftest troca o HOME por uma pasta vazia (isolamento): o Chromium fica num lugar fixo
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: command_center/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: command_center/web/dist
      - run: pip install -r command_center/requirements.txt pytest httpx playwright
      - run: python -m playwright install --with-deps chromium
      - run: CC_E2E=1 python -m pytest -q command_center/tests/e2e --parte ${{ matrix.parte }}/${{ strategy.job-total }}
      # #277 (dono, 15/10): a prova com fotos sai da VPS. Ela roda aqui, em todo PR e em todo push no branch
      # da VPS, e o pacote (RESUMO.md em português + fotos de cada passo em 390 e 1280 px) fica para baixar
      # em "Artifacts" da execução — mesmo quando falha, com a foto do estado do erro.
      # #344: roda numa parte só (a última, que tem um teste a menos no rodízio), para não repetir.
      - name: Prova do site e da venda, com fotos (390 e 1280 px)
        if: matrix.parte == strategy.job-total
        run: |
          mkdir -p provas/fotos
          CC_E2E=1 CC_FOTOS="$GITHUB_WORKSPACE/provas/fotos" python -m pytest -q command_center/tests/e2e/test_pacote_de_provas.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.parte == strategy.job-total
        with:
          name: prova-com-fotos
          path: provas/
          retention-days: 14
          if-no-files-found: ignore

  # #286: o repositório é privado e a VPS não lê a API do GitHub sem login (404). Com os três jobs verdes
  # (#344: `needs` de um job em matriz espera TODAS as partes — uma vermelha e a tag não sai)
  # num push ao branch da VPS, fica no repositório a tag `ci-verde/<sha>`; o deploy a procura pelo git, com
  # a mesma chave SSH do `git pull` — nenhum token novo na VPS. Sem a tag, a bateria roda lá como antes.
  verde:
    name: Marca o verde para o deploy (tag ci-verde)
    # #387: sai com a bateria verde OU com a árvore já testada no PR (aí os três jobs ficam "skipped")
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/claude/commandcenter-vps' &&
      (needs.arvore.outputs.testada == 'true' ||
       (needs.python.result == 'success' && needs.web.result == 'success' && needs.e2e.result == 'success'))
    needs: [arvore, python, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag ci-verde/<sha>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X POST "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/tags/ci-verde/${{ github.sha }}" -f sha="${{ github.sha }}" > resposta.txt 2>&1; then
            echo "tag ci-verde/${{ github.sha }} criada"
          elif grep -q "Reference already exists" resposta.txt; then
            echo "a tag já existia (re-run)"
          else
            cat resposta.txt; exit 1
          fi

  # #387: PR verde (do próprio repositório) grava a árvore testada — o código do PR já unido à base. O commit do
  # merge com a mesma árvore não roda a bateria de novo (job `arvore`).
  arvore-verde:
    name: Grava a árvore testada (ci-arvore)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [python, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag ci-arvore/<árvore>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arvore=$(gh api "repos/${{ github.repository }}/git/commits/${{ github.sha }}" --jq .tree.sha)
          if gh api -X POST "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/tags/ci-arvore/$arvore" -f sha="${{ github.sha }}" > resposta.txt 2>&1; then
            echo "tag ci-arvore/$arvore criada"
          elif grep -q "Reference already exists" resposta.txt; then
            echo "a árvore já estava marcada"
          else
            cat resposta.txt; exit 1
          fi
